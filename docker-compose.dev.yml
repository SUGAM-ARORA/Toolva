# ─── Toolva Development Stack ──────────────────────────────
# Usage: docker compose -f docker-compose.dev.yml up
# ────────────────────────────────────────────────────────────
version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: toolva-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    networks:
      - toolva-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toolva-backend-dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=dev-secret-key-not-for-production
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - GIN_MODE=debug
    volumes:
      - ./backend:/app
    networks:
      - toolva-dev

networks:
  toolva-dev:
    driver: bridge
